apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sweeper.fullname" . }}-scaler
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]